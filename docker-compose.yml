# netlab-ui as a container — `docker compose up -d`, then open
# http://localhost:8000.
#
# The UI only: netlab and containerlab stay on the host, where you installed
# them, and the container uses that install. Set NETLAB_BIN to the host's netlab
# and CLAB_DIR to the directory holding containerlab:
#
#   NETLAB_BIN=$(command -v netlab) CLAB_DIR=$(dirname "$(command -v containerlab)") \
#     docker compose up -d
#
# The install is mounted at the same path it has on the host, so its shebangs
# and (on NixOS) store references resolve unchanged. HOST_TOOLS_DIR is the
# directory that holds it: /nix/store on NixOS, or e.g. the venv netlab lives in.
#
# Why each setting is here (the UI checks all of them itself and explains any
# that are missing under Settings → Environment → Container Setup):
#   * privileged / host network / host pid — containerlab creates network
#     namespaces, veth links and sysctls for the lab nodes, and node
#     management IPs must be reachable for SSH and web UIs. The same access
#     lets the UI start your AI agents (Claude Code, Codex, ...) on the host
#     with nsenter, so they are not installed in the image (AI agents panel).
#   * docker.sock — labs run on the host's Docker daemon, next to this one.
#   * the labs directory is mounted at the SAME path it has on the host:
#     containerlab asks the host daemon to bind-mount node files by their
#     in-container path, so the two must match.
#   * ~/.netlab — netlab's running-lab registry. Shared with `netlab status`
#     on the host and kept across container re-creation (otherwise labs
#     started from the UI become orphans).

services:
  netlab-ui:
    image: ghcr.io/muddyblack/netlab-ui:${NETLAB_UI_TAG:-latest}
    # `docker compose build` builds the same image from a checkout.
    build:
      context: .
      target: ui
    container_name: netlab-ui
    restart: unless-stopped
    privileged: true
    network_mode: host
    pid: host
    environment:
      NETLAB_WORKSPACE: ${LABS_DIR:-${PWD}/labs}
      # The UI can deploy labs and open root shells on their nodes: keep it on
      # loopback unless you mean to expose it (set NETLAB_UI_HOST=0.0.0.0).
      UVICORN_HOST: ${NETLAB_UI_HOST:-127.0.0.1}
      UVICORN_PORT: ${NETLAB_UI_PORT:-8000}
      # Set NETLAB_UI_AUTH=user:password (e.g. in .env) before exposing it.
      NETLAB_UI_AUTH: ${NETLAB_UI_AUTH:-}
      NETLAB_GUI_CONTAINER: netlab-ui
      NETLAB_BIN: ${NETLAB_BIN:?set NETLAB_BIN to the host netlab, e.g. NETLAB_BIN=$(command -v netlab)}
      # containerlab is called directly for a few features (netem, cleanup, link reconcile).
      PATH: ${CLAB_DIR:-/usr/bin}:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/netns:/var/run/netns
      - ${LABS_DIR:-${PWD}/labs}:${LABS_DIR:-${PWD}/labs}
      - ${HOME}/.netlab:/root/.netlab
      - ${HOST_TOOLS_DIR:-/nix/store}:${HOST_TOOLS_DIR:-/nix/store}:ro
      # UI settings, workspaces list, assistant history.
      - netlab-ui-state:/root

volumes:
  netlab-ui-state:
