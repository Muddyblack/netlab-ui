# Dev convenience. The backend needs the `netlab` CLI and a provider
# (containerlab and/or libvirt) available on the host it runs on, so for real
# lab lifecycle you typically run the backend directly on a netlab host rather
# than in this container. This compose file is primarily for the UI + adapter.

services:
  backend:
    build: ./backend
    working_dir: /work
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./labs:/work
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONPATH=/app
      - NETLAB_WORKSPACE=/work
      - NETLAB_WORKSPACE_CONFIG=/work/.netlab_gui_workspaces.json
    ports:
      - "8000:8000"
    # network_mode: host   # uncomment on Linux so `netlab status`/clab work

  frontend:
    image: node:24
    working_dir: /app
    command: sh -c "npm run dev -- --host"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_BASE=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
