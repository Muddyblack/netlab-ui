links:
- _linkname: links[1]
  interfaces:
  - ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.1/30
    node: r1
  - ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.2/30
    node: r2
  linkindex: 1
  node_count: 2
  prefix:
    ipv4: 10.1.0.0/30
  type: p2p
- _linkname: links[2]
  interfaces:
  - ifindex: 2
    ifname: eth2
    ipv4: 10.1.0.5/30
    node: r2
  - ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.6/30
    node: r3
  linkindex: 2
  node_count: 2
  prefix:
    ipv4: 10.1.0.4/30
  role: external
  type: p2p
- _linkname: links[3]
  interfaces:
  - ifindex: 2
    ifname: eth2
    ipv4: 10.1.0.10/30
    node: r3
  - ifindex: 2
    ifname: eth2
    ipv4: 10.1.0.9/30
    node: r1
  linkindex: 3
  node_count: 2
  prefix:
    ipv4: 10.1.0.8/30
  role: external
  type: p2p
- _linkname: links[4]
  bridge: lab3_4
  interfaces:
  - ifindex: 1
    ifname: eth1
    ipv4: 172.16.0.4/24
    node: h1
  - ifindex: 3
    ifname: eth3
    ipv4: 172.16.0.1/24
    node: r1
  linkindex: 4
  node_count: 2
  prefix:
    ipv4: 172.16.0.0/24
  role: stub
  type: lan
groups:
  as65000:
    members:
    - r1
    - r2
  as65003:
    members:
    - r3
  netlab_no_collect:
    members:
    - h1
  netlab_no_reload:
    members:
    - h1
monitoring:
  grafana:
    admin_password: admin
    anonymous_role: Viewer
    enabled: true
  images:
    collector: python:3.13-alpine
    gnmic: ghcr.io/openconfig/gnmic:0.42.0
    grafana: grafana/grafana:12.2.0
    snmp: prom/snmp-exporter:v0.29.0
    tsdb: victoriametrics/victoria-metrics:v1.126.0
  interval: 15
  node_prefix: mon
  placement: tool
  ports:
    collector: 9480
    gnmic: 9804
    grafana: 3000
    snmp: 9116
    tsdb: 8428
  profiles:
    cat8000v:
      use: iosv
    csr:
      use: iosv
    cumulus:
      use: frr
    cumulus_nvue:
      use: frr
    eos:
      config: monitoring
      gnmi:
        encoding: json
        mapping: openconfig
        password: admin
        port: 6030
        tls: insecure
        username: admin
      method: gnmi
    frr:
      frr:
        socket_dirs:
        - run/frr
        - var/run/frr
      method: frr
    iol:
      use: iosv
    ioll2:
      use: iosv
    iosv:
      config: monitoring
      method: snmp
    iosvl2:
      use: iosv
    linux:
      method: host
    nxos:
      config: monitoring
      method: snmp
    srlinux:
      gnmi:
        encoding: json_ietf
        mapping: srlinux
        password: NokiaSrl1!
        port: 57400
        tls: skip-verify
        username: admin
      method: gnmi
    vjunos-router:
      config: monitoring
      gnmi:
        encoding: json
        mapping: openconfig
        password: Vagrant
        port: 32767
        tls: insecure
        username: vagrant
      method: gnmi
    vjunos-switch:
      use: vjunos-router
    vmx:
      use: vjunos-router
    vptx:
      use: vjunos-router
    vsrx:
      use: vjunos-router
    vyos:
      use: frr
  retention: 7d
  snmp:
    community: public
  workers: 16
defaults:
  providers:
    clab:
      lab_prefix: clab
