      linkindex: 2
      mtu: 1500
      name: r3 -> r2
      neighbors:
      - ifname: eth2
        ipv4: 10.1.0.5/30
        node: r2
      role: external
      type: p2p
    - ifindex: 2
      ifname: eth2
      ipv4: 10.1.0.10/30
      linkindex: 3
      mtu: 1500
      name: r3 -> r1
      neighbors:
      - ifname: eth2
        ipv4: 10.1.0.9/30
        node: r1
