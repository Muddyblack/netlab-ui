<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>netlab-ui</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #0b0f19;
        color: #e6e9ef;
        font-family:
          -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      form {
        width: 360px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 8px;
        color: #9aa4b2;
        font-size: 13px;
      }
      input {
        background: #151b2d;
        border: 1px solid #2a3244;
        border-radius: 6px;
        color: inherit;
        padding: 10px 12px;
        font-size: 14px;
      }
      button {
        background: linear-gradient(90deg, #ff9f01, #d26400);
        border: none;
        border-radius: 6px;
        color: #0b0f19;
        font-weight: 600;
        padding: 10px 12px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        min-height: 18px;
        font-size: 13px;
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <form id="connect-form">
      <h1>netlab-ui</h1>
      <p>Point this at a running netlab-ui backend (local or remote).</p>
      <input id="server-url" type="url" placeholder="http://localhost:8000" required />
      <button id="connect-btn" type="submit">Connect</button>
      <div id="status"></div>
    </form>
    <script src="connect.js"></script>
  </body>
</html>
