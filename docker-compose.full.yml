# netlab-ui with netlab, Ansible and containerlab inside the image — `docker compose -f
# docker-compose.full.yml up -d`, then open http://localhost:8000. Needs only Docker on the host.
#
# docker-compose.yml is the UI-only variant that uses the netlab installed on the host; the
# settings here are the same as there and for the same reasons (see that file), minus the
# host tools mount.

services:
  netlab-ui:
    image: ghcr.io/muddyblack/netlab-ui:${NETLAB_UI_TAG:-latest}-full
    build:
      context: .
      target: full
    container_name: netlab-ui
    restart: unless-stopped
    privileged: true
    network_mode: host
    pid: host
    environment:
      NETLAB_WORKSPACE: ${LABS_DIR:-${PWD}/labs}
      UVICORN_HOST: ${NETLAB_UI_HOST:-127.0.0.1}
      UVICORN_PORT: ${NETLAB_UI_PORT:-8000}
      NETLAB_UI_AUTH: ${NETLAB_UI_AUTH:-}
      NETLAB_UI_CONTAINER: netlab-ui
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/netns:/var/run/netns
      # Same path as on the host: containerlab asks the host Docker daemon to bind-mount node files by it.
      - ${LABS_DIR:-${PWD}/labs}:${LABS_DIR:-${PWD}/labs}
      - ${HOME}/.netlab:/root/.netlab
      # UI settings, workspaces list, assistant history.
      - netlab-ui-state:/root

volumes:
  netlab-ui-state:
