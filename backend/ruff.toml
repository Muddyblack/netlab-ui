# Ruff configuration for SW-Pool Backend
line-length = 120
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-native (stale noqa, unsorted __all__, unused unpacked vars, ...)
    "ARG",  # flake8-unused-arguments
    "BLE",  # flake8-blind-except
    # Not "S" (flake8-bandit): 450+ of its hits are S101 on ordinary `assert`
    # in the test suite (the correct pytest idiom), plus false positives on
    # subprocess/hashlib use inherent to a CLI-wrapper backend.
]
ignore = ["B008"]

[lint.per-file-ignores]
# ARG001 false-positives on pytest fixtures used for their setup side effect
# (client, workspace, monkeypatch, tmp_path, ...) — the parameter name is
# matched by pytest, so it can't be prefixed with `_` like a real unused arg.
"tests/*" = ["ARG001"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
