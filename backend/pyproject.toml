[project]
name = "netlab-ui"
version = "0.0.1"
description = "Web UI for netlab and containerlab: draw, deploy and monitor network labs in the browser"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# LICENSE is a symlink to the repository's, so the sdist and wheel carry it.
license-files = ["LICENSE"]
keywords = ["netlab", "containerlab", "networking", "network-automation", "topology", "lab", "web-ui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "ruamel.yaml>=0.18",
    "ptyprocess>=0.7",
    # Guarded import; without it the frontend falls back to interval polling.
    "watchfiles>=0.21",
    # MCP server for the user's own AI agent (services/assistant; NETLAB_APP_ASSISTANT=off
    # disables it). mcp 2.x API (MCPServer); 1.x no longer works.
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
# Split out so local dev against an existing system/pipx `netlab` isn't
# forced onto a pip-managed copy. PyPI name `networklab`, imports as `netsim`;
# version floor tracked in services/netlab/runner.py MIN_NETLAB_VERSION.
netlab = [
    "networklab>=26.10",
    # Required by the `netlab` CLI for Ansible-based config deployment, not
    # imported directly by the adapter.
    "ansible>=9",
    "ansible-pylibssh>=1.2",
]
# `netlab-ui --app` draws a native window with pywebview. The Qt flavour is pip-installable, so it also
# works inside a pipx venv (the GTK one needs system packages pipx cannot see).
window = ["pywebview[qt]>=5"]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "ruff>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/Muddyblack/netlab-ui"
Documentation = "https://github.com/Muddyblack/netlab-ui/tree/main/docs"
Source = "https://github.com/Muddyblack/netlab-ui"
Issues = "https://github.com/Muddyblack/netlab-ui/issues"
Changelog = "https://github.com/Muddyblack/netlab-ui/releases"
"Live preview" = "https://muddyblack.github.io/netlab-ui/"

[project.scripts]
netlab-ui = "netlab_ui.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]  # 77 adds SPDX `license` and `license-files` (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["netlab_ui*"] } }
include-package-data = true

[tool.setuptools.package-data]
# _frontend and _monitoring_plugin are copied in by scripts/build-wheel.sh.
netlab_ui = ["_frontend/**", "_monitoring_plugin/**", "app/schema/*.json"]

