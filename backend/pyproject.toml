[project]
name = "netlab-gui-backend"
dynamic = ["version"]
description = "Backend adapter/BFF for a netlab APP — drives the netlab CLI and speaks the clab-ui ClabUiHost contract"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "ruamel.yaml>=0.18",
    "ptyprocess>=0.7",
    # Guarded import; without it the frontend falls back to interval polling.
    "watchfiles>=0.21",
]

[project.optional-dependencies]
# Split out so local dev against an existing system/pipx `netlab` isn't
# forced onto a pip-managed copy. PyPI name `networklab`, imports as `netsim`;
# version floor tracked in services/netlab/runner.py MIN_NETLAB_VERSION.
netlab = [
    "networklab>=26.07",
    # Required by the `netlab` CLI for Ansible-based config deployment, not
    # imported directly by the adapter.
    "ansible>=9",
    "ansible-pylibssh>=1.2",
]
# See NETLAB_APP_ASSISTANT in services/assistant — feature is absent without this.
assistant = [
    "mcp>=1.9",
    "claude-agent-sdk>=0.1",
    "google-genai>=1.0",
    "openai>=1.99",
]
dev = [
    "pytest>=8.0",
    "httpx2>=0.28",
    "ruff>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = {} }

[tool.setuptools_scm]
fallback_version = "0.0+unknown"
