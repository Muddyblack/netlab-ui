version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Needs its patch-package patches ported by hand; tracked by clab-ui-watch.yml
      - dependency-name: "@containerlab/clab-ui"
      # clab-ui pins @mui/material 7.x exactly, and @mui/icons-material 9 peers on
      # material 9, so these majors cannot install until clab-ui moves (#79)
      - dependency-name: "@mui/material"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/icons-material"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR so upload-artifact and download-artifact always move together
      actions:
        patterns: ["*"]
