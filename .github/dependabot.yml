version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Needs its patch-package patches ported by hand; tracked by clab-ui-watch.yml
      - dependency-name: "@containerlab/clab-ui"
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR so upload-artifact and download-artifact always move together
      actions:
        patterns: ["*"]
