name: Publish Container Image

# Builds the UI image from the root Dockerfile and pushes it to GHCR. Called by
# release.yml when a version bump lands on the default branch. `desktop-v*` tags
# are handled by desktop-release.yml.
on:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v (e.g. 1.2.3)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The workflow does not run on a tag, so the semver patterns are given the
      # version explicitly (value=).
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ui
          # arm64 matters for Apple Silicon and arm-based lab hosts. Only the
          # Python stage is emulated — the frontend stage builds natively.
          platforms: linux/amd64,linux/arm64
          build-args: |
            NETLAB_UI_VERSION=v${{ inputs.version }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
