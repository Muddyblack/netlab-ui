name: Publish Container Image

# `desktop-v*` tags are handled by desktop-release.yml. Regular semver tags
# produce the all-in-one web application image from the root Dockerfile.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # the release job creates the GitHub Release for the tag
  packages: write

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    # Two images from one Dockerfile: the UI alone (uses the netlab on the host) and the UI with
    # netlab, Ansible and containerlab included (its tags get a -full suffix).
    strategy:
      matrix:
        include:
          - target: ui
            suffix: ""
          - target: full
            suffix: "-full"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          # arm64 matters for Apple Silicon and arm-based lab hosts. Only the
          # Python stage is emulated — the frontend stage builds natively.
          platforms: linux/amd64,linux/arm64
          build-args: |
            NETLAB_UI_VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Image tags come from docker/metadata-action's semver patterns, which
      # drop the leading "v" (tag v1.2.3 → image 1.2.3).
      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The GitHub Release is the landing page people reach from the tag, so
      # it leads with the pull command rather than only a source zip.
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            docker-compose.full.yml
            Dockerfile
          body: |
            ## Which image

            - **`<version>`** — the UI only. It uses the netlab and containerlab already installed
              on your machine (details below).
            - **`<version>-full`** — the UI with netlab, Ansible and containerlab included. Needs only
              Docker: download `docker-compose.full.yml` and run `docker compose -f docker-compose.full.yml up -d`.

            If netlab lives somewhere unusual, set its path under **Settings → Environment**.

            ## Run it

            This is the UI. netlab and containerlab stay on your host (install
            them with your package manager, pip or Nix), and the container
            talks to that install. Download `docker-compose.yml` from this
            release, then:

            ```bash
            NETLAB_BIN=$(command -v netlab) \
            CLAB_DIR=$(dirname "$(command -v containerlab)") \
              docker compose up -d        # → http://localhost:8000
            ```

            The labs directory must be mounted at the **same path** as on the
            host (containerlab bind-mounts node files through the host Docker
            daemon), and `~/.netlab` keeps netlab's running-lab registry shared
            with the host. The UI checks all of this itself: see
            **Settings → Environment → Container Setup**.

            Images: `linux/amd64`, `linux/arm64`. Also tagged `latest`.
