name: Publish Container Image

# `desktop-v*` tags are handled by desktop-release.yml. Regular semver tags
# produce the all-in-one web application image from the root Dockerfile.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # the release job creates the GitHub Release for the tag
  packages: write

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Same tags with a -full suffix (latest → latest-full) for the image that
      # bundles netlab, Ansible and containerlab (Dockerfile target `full`).
      - id: metadata-full
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-full,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ui
          # arm64 matters for Apple Silicon and arm-based lab hosts. Only the
          # Python stage is emulated — the frontend stage builds natively.
          platforms: linux/amd64,linux/arm64
          build-args: |
            NETLAB_GUI_VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          # One cache scope per target, or the second build overwrites the first's.
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          platforms: linux/amd64,linux/arm64
          build-args: |
            NETLAB_GUI_VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.metadata-full.outputs.tags }}
          labels: ${{ steps.metadata-full.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Image tags come from docker/metadata-action's semver patterns, which
      # drop the leading "v" (tag v1.2.3 → image 1.2.3).
      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The GitHub Release is the landing page people reach from the tag, so
      # it leads with the pull command rather than only a source zip.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            Dockerfile
          body: |
            ## Run it

            Everything included (netlab, Ansible, containerlab) — the host only
            needs Docker. Download `docker-compose.yml` from this release, then:

            ```bash
            docker compose up -d        # → http://localhost:8000
            ```

            or the equivalent `docker run`:

            ```bash
            mkdir -p "$PWD/labs"
            docker run -d --name netlab-ui \
              --privileged --network host --pid host \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /var/run/netns:/var/run/netns \
              -v "$PWD/labs:$PWD/labs" -e NETLAB_WORKSPACE="$PWD/labs" \
              -v "$HOME/.netlab:/root/.netlab" \
              -e UVICORN_HOST=127.0.0.1 \
              ghcr.io/muddyblack/netlab-ui:${{ steps.version.outputs.tag }}-full
            ```

            The labs directory must be mounted at the **same path** as on the
            host (containerlab bind-mounts node files through the host Docker
            daemon), and `~/.netlab` keeps netlab's running-lab registry shared
            with the host. The UI checks all of this itself: see
            **Settings → Environment → Container Setup**.

            ### UI-only image

            `ghcr.io/muddyblack/netlab-ui:${{ steps.version.outputs.tag }}` (no `-full`)
            leaves netlab, Ansible and containerlab on your host. Use the same
            flags, plus mount your netlab install at its own path and point the
            UI at it:

            ```bash
              -v /opt/netlab-venv:/opt/netlab-venv:ro \
              -e NETLAB_BIN=/opt/netlab-venv/bin/netlab \
              -v /usr/bin/containerlab:/usr/bin/containerlab:ro
            ```

            Images: `linux/amd64`, `linux/arm64`. Also tagged `latest` / `latest-full`.
