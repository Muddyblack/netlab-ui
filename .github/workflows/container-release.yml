name: Publish Container Image

# `desktop-v*` tags are handled by desktop-release.yml. Regular semver tags
# produce the all-in-one web application image from the root Dockerfile.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # the release job creates the GitHub Release for the tag
  packages: write

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ui
          # arm64 matters for Apple Silicon and arm-based lab hosts. Only the
          # Python stage is emulated — the frontend stage builds natively.
          platforms: linux/amd64,linux/arm64
          build-args: |
            NETLAB_GUI_VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Image tags come from docker/metadata-action's semver patterns, which
      # drop the leading "v" (tag v1.2.3 → image 1.2.3).
      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The GitHub Release is the landing page people reach from the tag, so
      # it leads with the pull command rather than only a source zip.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            Dockerfile
          body: |
            ## Run it

            This is the UI. netlab and containerlab stay on your host (install
            them with your package manager, pip or Nix), and the container
            talks to that install. Download `docker-compose.yml` from this
            release, then:

            ```bash
            NETLAB_BIN=$(command -v netlab) \
            CLAB_DIR=$(dirname "$(command -v containerlab)") \
              docker compose up -d        # → http://localhost:8000
            ```

            The labs directory must be mounted at the **same path** as on the
            host (containerlab bind-mounts node files through the host Docker
            daemon), and `~/.netlab` keeps netlab's running-lab registry shared
            with the host. The UI checks all of this itself: see
            **Settings → Environment → Container Setup**.

            Images: `linux/amd64`, `linux/arm64`. Also tagged `latest`.
