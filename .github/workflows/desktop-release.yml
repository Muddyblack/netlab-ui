name: Build & Release Desktop App

# Separate tag namespace (desktop-v*) from whatever `v*.*.*` tags already mean
# elsewhere in this repo, so cutting an unrelated tag doesn't trigger a
# desktop build/release by surprise.
on:
  push:
    tags:
      - "desktop-v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-script: build:linux
          - os: macos-latest
            build-script: build:mac
          - os: windows-latest
            build-script: build:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#desktop-v}" --no-git-tag-version

      - name: Check
        run: npm run check

      # electron-builder doesn't need @srl-labs/clab-ui or any registry auth —
      # the desktop app has no frontend build step of its own, it only points
      # a sandboxed window at a backend URL at runtime.
      - name: Package
        run: npm run ${{ matrix.build-script }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.dmg
            desktop/release/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
