name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which halves of the repo the PR actually touches, so a
  # frontend-only PR doesn't pay for a backend run (and vice versa).
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Manual runs have no diff to inspect — exercise everything.
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"

          match() { echo "$changed" | grep -qE "$1"; }

          if match '^(backend/|pyproject\.toml|\.github/workflows/ci\.yml)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if match '^(frontend/|\.github/workflows/ci\.yml)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          # The release image is only ever built on a tag push, so without this
          # a broken Dockerfile stays invisible until release day.
          if match '^(Dockerfile|\.dockerignore|\.github/workflows/(ci|container-release)\.yml)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,netlab,assistant]"

      - name: Lint (ruff check)
        run: ruff check

      - name: Format check (ruff format)
        run: ruff format --check

      - name: Tests
        run: pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # @srl-labs/clab-ui lives on GitHub Packages, so installing needs a token.
      - name: Configure GitHub Packages registry
        run: |
          echo "@srl-labs:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck + build
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

  # Builds the release image exactly as container-release.yml would, minus the
  # push — so Dockerfile regressions surface on the PR instead of on a tag.
  docker:
    needs: changes
    # Fork PRs cannot read GH_PACKAGES_TOKEN, and `npm ci` for clab-ui needs it,
    # so the job would always fail there. Skip rather than show a false red.
    if: >-
      needs.changes.outputs.docker == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Single arch on PRs: this is a "does it build" gate, and emulating
          # arm64 here would roughly double the run for no extra signal.
          platforms: linux/amd64
          # Shares the cache the release build populates, so tagging later is
          # mostly cache hits.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.GH_PACKAGES_TOKEN }}
