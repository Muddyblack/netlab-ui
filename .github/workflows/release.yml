name: Release

on:
  # Merging a release PR (scripts/tag.sh) bumps the version in backend/pyproject.toml on the
  # default branch. That push is the release: the tag does not exist yet.
  #
  #   prepare -> ci -> wheel (build + start it) --+-> pypi ---------+
  #                 \-> image (build + start it) -+-> image-tags ---+-> github-release (tag, last)
  #
  # pypi and image-tags both wait for wheel AND image, so a failure in either stops both publishes.
  #
  # Nothing is published until the full CI suite has passed on this exact commit and both the wheel
  # and the image have been started and answered. PyPI gets the wheel that was tested, the image
  # gets its version tags by digest, and the GitHub release carries the same files. Retry a failed
  # run with "Re-run failed jobs" (not a new run): that reuses the artifacts already built instead
  # of building different ones.
  # The desktop app releases separately (desktop-release.yml, desktop-v* tags).
  push:
    branches: [main]
    paths: [backend/pyproject.toml]
  workflow_dispatch:

# One release at a time, and never cancel a half-published one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Reads the version and works out whether it still needs a release. Pushes that touch the file
  # without bumping the version (or re-run an already released one) stop here.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version and whether it is released
        id: v
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION="$(grep -m1 -E '^version = "' backend/pyproject.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          [ -n "$VERSION" ] || { echo "::error::no version in backend/pyproject.toml"; exit 1; }
          TAG="v${VERSION}"
          NEW=true
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::notice::Releases are only cut from $DEFAULT_BRANCH."
            NEW=false
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::${TAG} is already released."
            NEW=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "new=$NEW"
            case "$VERSION" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac
          } >> "$GITHUB_OUTPUT"

  # The whole suite on the release commit. The PR's own run does not count: main may have moved
  # since, and a PR that skipped jobs through path filters still has to pass everything here.
  ci:
    needs: prepare
    if: needs.prepare.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  wheel:
    needs: [prepare, ci]
    uses: ./.github/workflows/_wheel.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read

  image:
    needs: [prepare, ci]
    uses: ./.github/workflows/_image.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      packages: write

  pypi:
    needs: [prepare, wheel, image]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # A new run (instead of "Re-run failed jobs") rebuilds the wheel, and the rebuild can differ from
      # what an earlier run already uploaded. skip-existing keeps PyPI's file, so say so.
      - name: Compare with what PyPI already has
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          meta="$(curl -fsS "https://pypi.org/pypi/netlab-ui/${VERSION}/json" || true)"
          [ -n "$meta" ] || { echo "Not on PyPI yet."; exit 0; }
          for f in dist/*; do
            mine="$(sha256sum "$f" | cut -d' ' -f1)"
            theirs="$(jq -r --arg n "$(basename "$f")" '.urls[] | select(.filename == $n) | .digests.sha256' <<<"$meta")"
            if [ -n "$theirs" ] && [ "$mine" != "$theirs" ]; then
              echo "::warning::$(basename "$f") is already on PyPI with different contents; PyPI's copy is kept. Re-run the failed jobs of the original run to reuse its artifacts."
            fi
          done

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true # a re-run after a later job failed must not fail on files already uploaded

  # Gives the tested image its release tags without rebuilding it.
  image-tags:
    needs: [prepare, wheel, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.image.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }}

      - name: Tag the tested digest
        env:
          SOURCE: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            "$SOURCE"

  github-release:
    needs: [prepare, pypi, image-tags]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # The GitHub Release is the landing page people reach from the tag, so it leads with how to
      # install rather than only a source zip. Notes are grouped by commit type, with breaking
      # changes first (scripts/release-notes.sh).
      - name: Generate release notes and the pinned compose file
        id: notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          PREV_TAG="$(git tag --sort=-creatordate | grep -E '^v[0-9]' | sed -n '1p')"
          {
            echo "notes<<EOF"
            scripts/release-notes.sh "$PREV_TAG" HEAD
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # This release's compose file runs this release's image, not whatever `latest` is by then.
          sed "s#NETLAB_UI_TAG:-latest#NETLAB_UI_TAG:-${VERSION}#" docker-compose.yml > dist/docker-compose.yml
          grep -q "NETLAB_UI_TAG:-${VERSION}" dist/docker-compose.yml
          (cd dist && sha256sum -- * > SHA256SUMS)

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: dist/*
          body: |
            ## Install

            ```bash
            pipx install netlab-ui==${{ needs.prepare.outputs.version }}        # then: netlab-ui
            ```

            or the install script (see `docs/install.md`), a NixOS module, or the container below.
            Update later with `netlab-ui upgrade`.

            ## Run it as a container

            This is the UI. netlab and containerlab stay on your host (install
            them with your package manager, pip or Nix), and the container
            talks to that install. Download `docker-compose.yml` from this
            release (it is pinned to `${{ needs.prepare.outputs.version }}`), then:

            ```bash
            NETLAB_BIN=$(command -v netlab) \
            CLAB_DIR=$(dirname "$(command -v containerlab)") \
            HOST_TOOLS_DIR=$(dirname "$(dirname "$(readlink -f "$(command -v netlab)")")") \
              docker compose up -d        # → http://localhost:8000
            ```

            `HOST_TOOLS_DIR` is the directory holding your netlab install, mounted read-only at
            the same path. For a pipx or venv install the line above finds it; on NixOS use
            `HOST_TOOLS_DIR=/nix/store`.

            The labs directory must be mounted at the **same path** as on the
            host (containerlab bind-mounts node files through the host Docker
            daemon), and `~/.netlab` keeps netlab's running-lab registry shared
            with the host. The UI checks all of this itself: see
            **Settings → Environment → Container Setup**.

            Images: `linux/amd64`, `linux/arm64`. `SHA256SUMS` lists the checksums of the files
            attached here; they are the same files that were published to PyPI.

            ## Changes
            ${{ steps.notes.outputs.notes }}
