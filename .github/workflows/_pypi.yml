name: Publish PyPI package

# Builds the backend wheel with the UI and monitoring plugin bundled in
# (scripts/build-wheel.sh) and publishes it with PyPI trusted publishing.
# Called by release.yml when a version bump lands on the default branch; the
# version is the one in backend/pyproject.toml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: scripts/build-wheel.sh
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: backend/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
