name: PR release flag

# Merging a PR that bumps the version in backend/pyproject.toml publishes a release
# (release.yml). Mark such PRs with a label and a comment so it is obvious at a glance,
# however many files the diff touches.
#
# pull_request_target so fork PRs can be labelled too. Nothing from the PR is checked out or
# executed: the version is only read through the API as text.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions: {}

concurrency:
  group: release-flag-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const LABEL = 'new-release';
            const MARKER = '<!-- release-flag -->';
            const PATH = 'backend/pyproject.toml';

            const versionIn = (text) => {
              const m = text.match(/^version = "([^"]+)"/m);
              return m ? m[1] : null;
            };

            const versionAt = async (o, r, ref) => {
              try {
                const { data } = await github.rest.repos.getContent({ owner: o, repo: r, path: PATH, ref });
                return versionIn(Buffer.from(data.content, 'base64').toString('utf8'));
              } catch (e) {
                core.warning(`Could not read the version at ${ref}: ${e.message}`);
                return null;
              }
            };

            const base = await versionAt(owner, repo, pr.base.sha);
            // The head repo may be a fork, so read it from there.
            const head = await versionAt(pr.head.repo.owner.login, pr.head.repo.name, pr.head.sha);

            const bumped = !!base && !!head && base !== head;
            core.info(`base=${base} head=${head} bumped=${bumped}`);

            // Sticky comment: one per PR, updated or removed as the version changes.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number,
            });
            const mine = comments.find((c) => c.body && c.body.includes(MARKER));

            if (bumped) {
              const body = `${MARKER}\n> [!IMPORTANT]\n> **This PR is a release.** It bumps the version \`${base}\` → \`${head}\`. Merging it into \`main\` publishes \`v${head}\`: the PyPI package, the container image and the GitHub release.`;
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [LABEL] });
              } catch (e) {
                // Label missing: create it, then retry.
                await github.rest.issues.createLabel({
                  owner, repo, name: LABEL, color: 'd93f0b',
                  description: 'Bumps the version: merging publishes a release',
                });
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [LABEL] });
              }
              if (mine) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              }
            } else {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: LABEL });
              } catch (e) { /* not set */ }
              if (mine) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: mine.id });
              }
            }
